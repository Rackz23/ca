
<!DOCTYPE html>
<html lang="en">
<head>
<script async defer src="https://tools.luckyorange.com/core/lo.js?site-id=112da6f5"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help Feed Florida's Rescue Animals Tonight</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      background: #fafafa;
      color: #222;
      text-align: center;
    }
    header {
      background: #fffbf2;
      padding: 24px 16px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #2b2b2b;
    }
    p.sub {
      margin: 0 auto 18px;
      max-width: 500px;
      font-size: 1.05rem;
    }
    img.hero {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
    }
    .donate-section {
      padding: 24px 16px;
    }
    .impact {
      background: #fff;
      border-radius: 8px;
      margin: 16px auto;
      padding: 16px;
      max-width: 500px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      font-size: 0.95rem;
    }
    .progress {
      width: 80%;
      height: 12px;
      background: #e5e5e5;
      border-radius: 6px;
      margin: 10px auto;
      overflow: hidden;
    }
    .bar {
      width: 83%;
      height: 100%;
      background: #5cb85c;
    }
    .buttons button {
      background: #ff6b35;
      color: #fff;
      border: none;
      padding: 12px 24px;
      margin: 8px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    footer {
      font-size: 0.8rem;
      color: #666;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Help Feed Florida's Rescue Animals Tonight</h1>
    <p class="sub">Every $5 fills one bowl of food for a homeless dog or cat in a Florida shelter.</p>
  </header>

  <img class="hero" src="https://images.unsplash.com/photo-1574158622682-e40e69881006?auto=format&fit=crop&w=1500&q=80" alt="Rescued dog looking into camera">

  <section class="donate-section">
    <div class="impact">
      ✅ 83 animals fed this week · Goal: 100
      <div class="progress"><div class="bar"></div></div>
    </div>

    <div class="buttons">
      <!-- Replace the # with your payment links -->
      <a href="https://buy.stripe.com/aFa8wIgar4sB3v7gAYgrS01"><button>$5</button></a>
      <a href="https://buy.stripe.com/00weV6f6n0clghT5WkgrS02"><button>$15</button></a>
      <a href="https://buy.stripe.com/dRm9AM3nF0clfdPbgEgrS03"><button>$25</button></a>
      <a href="#"><button>$50</button></a>
    </div>
  </section>

  <footer>
    Grassroots volunteer campaign supporting Florida shelters. Donations are not tax-deductible.<br>
    © 2025 Florida Animal Relief Fund
  </footer>
</body>
</html>
